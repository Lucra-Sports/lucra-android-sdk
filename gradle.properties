# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Ensure important default jvmargs aren't overwritten. See https://github.com/gradle/gradle/issues/19750
org.gradle.jvmargs=-Xmx12g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
# Not encouraged by Gradle and can produce weird results. Wait for isolated projects instead.
org.gradle.configureondemand=false
# Enable caching between builds.
org.gradle.caching=true
# Enable configuration caching between builds.
org.gradle.unsafe.configuration-cache=false
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Non-transitive R classes is recommended and is faster/smaller
android.nonTransitiveRClass=true
# Disable build features that are enabled by default,
# https://developer.android.com/studio/releases/gradle-plugin#buildFeatures
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
#SDK properties to drive distributing
publishGroupId=com.lucrasports.sdk
publishVersion=6.8.0
# Maven Central POM metadata (required for publishing)
POM_NAME=Lucra Android SDK
POM_DESCRIPTION=Lucra Sports SDK for Android
POM_URL=https://github.com/Lucra-Sports/lucra-android-sdk
POM_SCM_URL=https://github.com/Lucra-Sports/lucra-android-sdk
POM_SCM_CONNECTION=scm:git:git://github.com/Lucra-Sports/lucra-android-sdk.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/Lucra-Sports/lucra-android-sdk.git
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://github.com/Lucra-Sports/lucra-android-sdk/blob/develop/LICENSE
POM_DEVELOPER_ID=lucrasports
POM_DEVELOPER_NAME=Lucra Sports
POM_DEVELOPER_URL=https://github.com/Lucra-Sports/
# Vanniktech Maven Publish Plugin configuration
# Note: Direct Central Portal publishing is not supported due to Gradle API limitations
# with included builds. For Maven Central releases:
# 1. Publish to local Maven with signing: ./gradlew publishToMavenLocal -PsignAllPublications=true
# 2. Upload the bundle to Central Portal via Publisher API (done in CI)
#
# For local development without signing:
# ./gradlew publishToMavenLocal
# Signing is disabled by default for local builds.
# You need to set this to true if you want to publish to maven central locally
# -SNAPSHOT versions will not sign no matter what, but you still need credentials
signAllPublications=false
# If you want to publish from your local machine you MUST set these variables
# Sonatype Maven credentials - find them in 1password
# TODO DO NOT COMMIT THESE TO GIT, SPECIFY THEM IN YOUR ~/.gradle/gradle.properties
#signing.keyId=...
#signing.password=...
#signing.secretKeyRingFile=/Users/YourName/.gnupg/secring.gpg
# Maven Central credentials (user token custom username/password from https://central.sonatype.org)
#mavenCentralUsername=...
#mavenCentralPassword=...
